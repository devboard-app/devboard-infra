# Pinned so this file and the root compose file resolve to the SAME project.
# Every service sets an explicit container_name, which is global rather than
# project-scoped, so two projects can never hold the same service at once.
name: devboard

services:
  db:
    image: postgres:18-alpine
    container_name: devboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - devboard_pgdata:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devboard-network
  
  redis:
    image: redis:7-alpine
    container_name: devboard-redis
    restart: unless-stopped
    # Redis is the event bus. Without AOF the stream and the consumer-group
    # offsets are lost on restart, so analytics and integrations silently skip
    # whatever was in flight.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - devboard_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devboard-network

  mongo:
    image: mongo:7
    container_name: devboard-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - devboard_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devboard-network

  minio:
    image: minio/minio
    container_name: devboard-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - devboard_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devboard-network

# Explicit names, for the same reason the network is external: this file is
# started both on its own (project "devboard-infra") and via the root compose
# file (project "devboard"). Without a fixed name Compose prefixes the project,
# so the two entry points would silently use two different sets of volumes and
# the data would look like it had vanished.
volumes:
  devboard_pgdata:
    name: devboard_pgdata
  devboard_mongodata:
    name: devboard_mongodata
  devboard_miniodata:
    name: devboard_miniodata
  devboard_redisdata:
    name: devboard_redisdata

# External here as well as in every service file, so all eight can be merged
# into one project by the root compose file without contradicting each other
# (a definition says "create it", external says "don't"). Created once with:
#   docker network create devboard-network
networks:
  devboard-network:
    name: devboard-network
    external: true