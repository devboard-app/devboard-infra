# Pinned so this file and the root compose file resolve to the SAME project.
# Every service sets an explicit container_name, which is global rather than
# project-scoped, so two projects can never hold the same service at once.
name: devboard-ic

services:
  db:
    image: postgres:18-alpine
    container_name: devboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by init-db/01-init.sh on first initialisation only.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:-}
      WORK_DB_PASSWORD: ${WORK_DB_PASSWORD:-}
      INTEGRATIONS_DB_PASSWORD: ${INTEGRATIONS_DB_PASSWORD:-}
      ATTACHMENTS_DB_PASSWORD: ${ATTACHMENTS_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - devboard-ic_pgdata:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      # -h 127.0.0.1, not the default socket: while init-db runs, Postgres is a
      # temporary socket-only server, and a socket check would report healthy
      # before the service roles exist — the migrate-* jobs in stack.yml would
      # then start against a database with no users.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devboard-ic-network
  
  redis:
    image: redis:7-alpine
    container_name: devboard-redis
    restart: unless-stopped
    # Redis is the event bus. Without AOF the stream and the consumer-group
    # offsets are lost on restart, so analytics and integrations silently skip
    # whatever was in flight.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - devboard-ic_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devboard-ic-network

  mongo:
    image: mongo:7
    container_name: devboard-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      # Consumed by init-mongo/01-analytics-user.js on first initialisation only.
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:17017:27017"
    volumes:
      - devboard-ic_mongodata:/data/db
      - ./init-mongo:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devboard-ic-network

  minio:
    image: minio/minio
    container_name: devboard-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:19000:9000"   # S3 API
      - "127.0.0.1:19001:9001"   # web console
    volumes:
      - devboard-ic_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devboard-ic-network

# Explicit names, for the same reason the network is external: this file is
# started both on its own (project "devboard-infra") and via the root compose
# file (project "devboard-ic"). Without a fixed name Compose prefixes the project,
# so the two entry points would silently use two different sets of volumes and
# the data would look like it had vanished.
volumes:
  devboard-ic_pgdata:
    name: devboard-ic_pgdata
  devboard-ic_mongodata:
    name: devboard-ic_mongodata
  devboard-ic_miniodata:
    name: devboard-ic_miniodata
  devboard-ic_redisdata:
    name: devboard-ic_redisdata

# External here as well as in every service file, so all eight can be merged
# into one project by the root compose file without contradicting each other
# (a definition says "create it", external says "don't"). Created once with:
#   docker network create devboard-ic-network
networks:
  devboard-ic-network:
    name: devboard-ic-network
    external: true