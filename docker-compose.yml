services:
  db:
    image: postgres:18-alpine
    container_name: devboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - devboard_pgdata:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devboard-network
  
  redis:
    image: redis:7-alpine
    container_name: devboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - devboard-network

  mongo:
    image: mongo:7
    container_name: devboard-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - devboard_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devboard-network

volumes:
  devboard_pgdata:
  devboard_mongodata:

networks:
  devboard-network:
    name: devboard-network
    driver: bridge
