# DevBoard — one entry point for the whole stack.
#
# Run from the DevBoard root (the directory holding all eight repos):
#
#   docker network create devboard-ic-network                  # once, first run only
#   docker compose -f devboard-infra/stack.yml up -d --build
#   docker compose -f devboard-infra/stack.yml ps -a        # migrate-* show "Exited (0)" when done
#   docker compose -f devboard-infra/stack.yml logs -f devboard-work
#   docker compose -f devboard-infra/stack.yml down         # stops all, keeps volumes
#
# Migrations run automatically, as the one-shot migrate-* jobs at the bottom of
# this file. They wait for Postgres to be healthy, migrate, and exit. They
# live here and not in each service's compose file because depends_on on
# devboard-db would break standalone `up` in each repo (see the note below).
# The app containers don't wait for them, so for the first few seconds of a
# fresh install they can error on requests — that clears once the jobs exit.
# (A migrate step inside each app's startup command was tried before and
# reverted: it made the whole app container fail whenever Postgres was slow.)
# migrate.bat still works for re-running migrations after a model change.
#
# Sibling repos are referenced by directory name, so all eight must be cloned
# side by side under one parent — the same assumption the .bat scripts here
# already make. This file aggregates; docker-compose.yml next to it is
# infra-only (Postgres, Redis, Mongo, MinIO).
#
# Every service keeps its own compose file and stays runnable on its own
# (`cd devboard-work && docker compose up -d` still works).
#
# Why `include:` and not `-f a.yml -f b.yml ...`:
# `-f` merges files but resolves every relative path against the FIRST file's
# directory, so each service's `build: context: .` and `env_file: .env` would
# point at C:\DevBoard instead of its own repo. `include` gives each file its
# own directory as the base, which is exactly what we need here.
#
# Note: `include` does NOT create depends_on across files. Everything starts at
# once and the app containers restart until Postgres passes its healthcheck.
# `restart: unless-stopped` makes that self-correcting — noisy logs, right
# outcome. Adding depends_on here would break standalone `up` in each repo,
# where devboard-db is not defined.

name: devboard-ic

include:
  # Long syntax for infra only. Its file uses ${POSTGRES_USER} and friends, and
  # `${}` interpolation reads the ROOT project's environment, not the included
  # file's directory — without this those variables resolve to empty and
  # Postgres starts with no user.
  - path: ./docker-compose.yml
    env_file: ./.env

  # The service files use `env_file:` on the service itself. That is runtime
  # environment, resolved relative to each repo, not parse-time interpolation —
  # so bare paths are enough here.
  - ../devboard-auth/docker-compose.yml
  - ../devboard-email/docker-compose.yml
  - ../devboard-core/docker-compose.yml
  - ../devboard-work/docker-compose.yml
  - ../devboard-integrations/docker-compose.yml
  - ../devboard-analytics/docker-compose.yml
  - ../devboard-attachments/docker-compose.yml
  - ../devboard-web2/docker-compose.yml

# ── Migrations ────────────────────────────────────────────────
# One-shot jobs, one per service with a Postgres database. Each builds from the
# same repo as its app (so it reuses the app's cached image layers), reads the
# same .env, and runs the same command migrate.bat does. They exit when done;
# `restart: on-failure:3` only covers a transient connection failure.
#
# depends_on works here because `include` merges devboard-infra's own
# docker-compose.yml into this project, so `db` is a known service.
services:
  migrate-auth:
    build: ../devboard-auth
    env_file: ../devboard-auth/.env
    command: alembic upgrade head
    restart: on-failure:3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devboard-ic-network

  migrate-core:
    build: ../devboard-core
    env_file: ../devboard-core/.env
    environment:
      DB_HOST: devboard-db
      DB_PORT: 5432
    command: python manage.py migrate
    restart: on-failure:3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devboard-ic-network

  migrate-work:
    build: ../devboard-work
    env_file: ../devboard-work/.env
    environment:
      DB_HOST: devboard-db
      DB_PORT: 5432
      REDIS_URL: redis://devboard-redis:6379/0
    command: python manage.py migrate
    restart: on-failure:3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devboard-ic-network

  migrate-integrations:
    build: ../devboard-integrations
    env_file: ../devboard-integrations/.env
    environment:
      DB_HOST: devboard-db
      DB_PORT: 5432
      REDIS_HOST: devboard-redis
    command: alembic upgrade head
    restart: on-failure:3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devboard-ic-network

  migrate-attachments:
    build: ../devboard-attachments
    env_file: ../devboard-attachments/.env
    command: alembic upgrade head
    restart: on-failure:3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devboard-ic-network

# ── Demo data ─────────────────────────────────────────────────
# One-shot: fills a fresh install with the demo workspace from
# devboard-analytics/scripts/seed_demo.py (users, teams, projects, sprints,
# tickets, comments). Runs on the auth image, which already has httpx and
# psycopg2, and reads auth's .env for DATABASE_URL_SYNC and INTERNAL_API_KEY.
# The script is idempotent: on an existing install it finds everything already
# there and exits 0 without changing anything.
  seed-demo:
    build: ../devboard-auth
    env_file: ../devboard-auth/.env
    environment:
      SEED_AUTH_URL: http://devboard-auth:8000
      SEED_CORE_URL: http://devboard-core:8000
      SEED_WORK_URL: http://devboard-work:8000
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../devboard-analytics/scripts/seed_demo.py:/seed/seed_demo.py:ro
    command: python /seed/seed_demo.py
    restart: on-failure:3
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      migrate-core:
        condition: service_completed_successfully
      migrate-work:
        condition: service_completed_successfully
      devboard-auth:
        condition: service_started
      devboard-core:
        condition: service_started
      devboard-work:
        condition: service_started
    networks:
      - devboard-ic-network
